<header class="header">
    <nav class="header-nav">
        <!-- Minimalist Home Icon Button -->
        <a href="{{ "" | absLangURL }}" class="home-icon-btn" title="Home" aria-label="Home">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>

        <!-- Live Stream Search Input -->
        <div class="header-search-box">
            <svg class="header-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="stream-search-input" class="header-search-input" placeholder="{{ if eq .Lang "ko" }}논문 제목, 저자, 토픽 검색...{{ else }}Search papers by title, topic, author...{{ end }}" autocomplete="off">
        </div>

        <!-- Controls: Theme Toggle & Full-Click Language Switcher -->
        <div class="header-controls" style="display: flex; align-items: center; gap: 0.75rem;">
            <!-- Dark / Light Theme Toggle -->
            {{- if (not site.Params.disableThemeToggle) }}
            <button id="theme-toggle" class="theme-toggle" accesskey="t" title="(Alt + T)" aria-label="Toggle theme" style="background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 8px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main);">
                <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
            {{- end }}

            <!-- Full-Box Language Switcher -->
            {{- $translations := .Translations -}}
            {{- if eq (len $translations) 0 -}}
              {{- $translations = site.Home.Translations -}}
            {{- end -}}
            {{- with $translations -}}
              {{- range . -}}
              <a href="{{ .Permalink }}" class="lang-switcher" title="Switch language" aria-label="Switch language">
                <span class="lang-btn{{ if eq $.Lang "ko" }} active{{ end }}">한국어</span>
                <span class="lang-btn{{ if eq $.Lang "en" }} active{{ end }}">EN</span>
              </a>
              {{- end -}}
            {{- end -}}
        </div>
    </nav>
</header>
