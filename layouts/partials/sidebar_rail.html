  <!-- Profile Card -->

      <div class="profile-name-box">

      </div>

  <!-- Category Widget (Conferences & Venues) -->
  <div class="sidebar-widget">
    <div class="widget-heading">
      <span>CATEGORY</span>
      <span id="active-cat-count" class="filter-count-badge"></span>
    </div>
    <ul class="venue-menu">
      <li>
        <button class="venue-btn" data-category="CVPR 2026" onclick="handleCategoryClick('CVPR 2026')">
          <span>CVPR 2026</span>
          <span class="venue-count" id="count-cvpr-2026">11</span>
        </button>
      </li>
      <li>
        <button class="venue-btn" data-category="CVPRW 2026" onclick="handleCategoryClick('CVPRW 2026')">
          <span>CVPRW 2026</span>
          <span class="venue-count" id="count-cvprw-2026">3</span>
        </button>
      </li>
      <li>
        <button class="venue-btn" data-category="ECCV 2026" onclick="handleCategoryClick('ECCV 2026')">
          <span>ECCV 2026</span>
          <span class="venue-count" id="count-eccv-2026">2</span>
        </button>
      </li>
      <li>
        <button class="venue-btn" data-category="Tutorials" onclick="handleCategoryClick('Tutorials')">
          <span>Tutorials</span>
          <span class="venue-count" id="count-tutorials">2</span>
        </button>
      </li>
      <li>
        <button class="venue-btn" data-category="ICLR 2026 Oral" onclick="handleCategoryClick('ICLR 2026 Oral')">
          <span>ICLR 2026 Oral</span>
          <span class="venue-count" id="count-iclr-2026">1</span>
        </button>
      </li>
      <li>
        <button class="venue-btn" data-category="WACV 2025" onclick="handleCategoryClick('WACV 2025')">
          <span>WACV 2025</span>
          <span class="venue-count" id="count-wacv-2025">1</span>
        </button>
      </li>
      <li>
        <button class="venue-btn" data-category="TCSVT 2025" onclick="handleCategoryClick('TCSVT 2025')">
          <span>TCSVT 2025</span>
          <span class="venue-count" id="count-tcsvt-2025">1</span>
        </button>
      </li>
    </ul>
  </div>

  <!-- Topics Widget (Keywords & Research Areas) -->
  <div class="sidebar-widget">
    <div class="widget-heading">
      <span>TOPICS</span>
      <span id="active-topic-count" class="filter-count-badge"></span>
    </div>
    <div class="topic-pills">
      <button class="topic-pill" data-topic="Video Understanding" onclick="handleTopicClick('Video Understanding')">Video Understanding</button>
      <button class="topic-pill" data-topic="Gaze Estimation" onclick="handleTopicClick('Gaze Estimation')">Gaze Estimation</button>
      <button class="topic-pill" data-topic="Domain Adaptation" onclick="handleTopicClick('Domain Adaptation')">Domain Adaptation</button>
      <button class="topic-pill" data-topic="Medical Segmentation" onclick="handleTopicClick('Medical Segmentation')">Medical Segmentation</button>
      <button class="topic-pill" data-topic="State Space Models" onclick="handleTopicClick('State Space Models')">State Space Models</button>
      <button class="topic-pill" data-topic="Open-Vocabulary" onclick="handleTopicClick('Open-Vocabulary')">Open-Vocabulary</button>
      <button class="topic-pill" data-topic="Vision-Language" onclick="handleTopicClick('Vision-Language')">Vision-Language</button>
      <button class="topic-pill" data-topic="Point Cloud" onclick="handleTopicClick('Point Cloud')">Point Cloud</button>
      <button class="topic-pill" data-topic="Efficient Inference" onclick="handleTopicClick('Efficient Inference')">Efficient Inference</button>
      <button class="topic-pill" data-topic="Time-Series" onclick="handleTopicClick('Time-Series')">Time-Series</button>
    </div>
  </div>
</aside>
<script>
function handleCategoryClick(cat) {
  if (typeof toggleCategory === 'function' && document.getElementById('paper-stream')) {
    toggleCategory(cat);
  } else {
    const rail = document.querySelector('.sidebar-rail');
    const homeUrl = (rail && rail.getAttribute('data-home-url')) || '/';
    window.location.href = homeUrl + '?category=' + encodeURIComponent(cat);
  }
}
function handleTopicClick(topic) {
  if (typeof toggleTopic === 'function' && document.getElementById('paper-stream')) {
    toggleTopic(topic);
  } else {
    const rail = document.querySelector('.sidebar-rail');
    const homeUrl = (rail && rail.getAttribute('data-home-url')) || '/';
    window.location.href = homeUrl + '?topic=' + encodeURIComponent(topic);
  }
}
</script>
