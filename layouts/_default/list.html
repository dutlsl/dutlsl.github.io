{{- define "main" }}
{{- if or .IsHome (eq .Section "posts") }}
  {{- partial "editorial_stream.html" . }}
{{- else }}
  <header class="page-header" style="max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 1rem;">
    <h1>{{ .Title }}</h1>
  </header>
  <div style="max-width: 860px; margin: 0 auto; padding: 0 1.5rem 3rem;">
    {{- range .Pages }}
    <article class="post-entry" style="margin-bottom: 1.5rem;">
      <header class="entry-header">
        <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
      </header>
      <div class="entry-content">
        <p>{{ .Summary }}</p>
      </div>
    </article>
    {{- end }}
  </div>
{{- end }}
{{- end }}
